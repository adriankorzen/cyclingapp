spring:
  application:
    name: cyclingapp
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate only verifies it
      ddl-auto: validate
  # Locally the datasource is provided by compose.yaml (spring-boot-docker-compose)
  docker:
    compose:
      file: compose.yaml

garmin:
  personal-api:
    base-url: https://personal.connectapi.garmin.com
    api-key: ${GARMIN_API_KEY:}
    # Garmin access tokens are valid for 24h; renew a bit earlier
    token-ttl: 23h
    # How far back the first sync of a rider reaches
    initial-sync-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
